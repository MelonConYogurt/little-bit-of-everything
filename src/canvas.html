<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas con Varias Figuras</title>
</head>
<body>
    <canvas id="miCanvas" width="1000" height="1000" style="border:1px solid black;"></canvas>

    <script>
        var canvas = document.getElementById("miCanvas");
        var ctx = canvas.getContext("2d");
        var widht = 400
        var height = 200
        var sizeX = 20
        var sizeY = 20
        var bordeWidht = 1

        var rows = 10
        var cols = 10

        var maxX = rows * (sizeX + (bordeWidht * 2))
        var maxY = cols * (sizeY + (bordeWidht * 2))

        ctx.strokeStyle = "black"; 
        ctx.lineWidth = bordeWidht; 
        for (var y = 0; y < maxY  ; y += (sizeY + (bordeWidht * 2))){
            for (var x = 0 ; x < maxX; x += (sizeX + (bordeWidht * 2))){
                ctx.strokeRect(x, y, sizeX, sizeY);
            }
        }
      
    </script>
</body>
</html>
